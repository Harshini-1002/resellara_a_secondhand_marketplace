spring.application.name=resellara-backend
server.port=8080

# Database Configuration (MySQL default, configurable via DB_PASSWORD etc.)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sellara_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration
sellara.jwt.secret=9a3f2c4e6b8a1d5e7f0b2d4c6e8a0f2b4c6e8a1d3f5b7c9e1a3d5f7b9c1e3a5d
sellara.jwt.expiration-ms=86400000

# Gmail SMTP Configuration for OTP Delivery
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${RESELLARA_SMTP_USERNAME:23r01a05t9@gmail.com}
spring.mail.password=${RESELLARA_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


